# Read the Docs build for the prebuilt Sourcey static site.
#
# The site in this repository is a deterministic Sourcey 3.6.5 build from the
# pinned upstream commit (see README.md). Read the Docs only has to serve those
# bytes, so the build shell copies the committed static output into
# $READTHEDOCS_OUTPUT/html instead of running a documentation generator.
version: 2
build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
  commands:
    - mkdir -p "$READTHEDOCS_OUTPUT/html"
    - tar --exclude=./_readthedocs --exclude=./.git --exclude=./.github --exclude=./.readthedocs.yaml -cf - . | tar -xf - -C "$READTHEDOCS_OUTPUT/html"
